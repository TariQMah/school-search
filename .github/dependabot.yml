version: 2
updates:
  # Development tooling only: the package has no runtime dependencies (React is a peer).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
